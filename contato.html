<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Contato</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap%22 rel="
        stylesheet" />

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <nav>
            <a href="index.html" class="logo">
            </a>

            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="contato.html" class="active">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- MAIN -->
    <main class="contato-page">

        <section class="form-section">

            <div class="section-header">
                <h2>Entre em <span>Contato</span></h2>

            </div>

            <form action="#" method="get" onsubmit="this.reset()">

                <!-- GRID -->
                <div class="form-grid">

                    <!-- Nome -->
                    <div class="input-box">
                        <label for="nome">Nome</label>

                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required maxlength="50">
                    </div>

                    <!-- Email -->
                    <div class="input-box">
                        <label for="email">Email</label>

                        <input type="email" id="email" name="email" placeholder="Digite seu email" required>
                    </div>

                    <!-- Senha -->
                    <div class="input-box">
                        <label for="senha">Senha</label>

                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" minlength="6"
                            required>
                    </div>

                    <!-- Idade -->
                    <div class="input-box">
                        <label for="idade">Idade</label>

                        <input type="number" id="idade" name="idade" min="1" max="120" placeholder="Sua idade" required>
                    </div>

                    <!-- Data -->
                    <div class="input-box">
                        <label for="data">Data de nascimento</label>

                        <input type="date" id="data" name="data" required>
                    </div>

                    <!-- Cidade -->
                    <div class="input-box">
                        <label for="cidade">Cidade</label>

                        <select id="cidade" name="cidade">

                            <option value="">Selecione</option>
                            <option value="ip">Ipatinga</option>
                            <option value="mg">Timóteo</option>
                            <option value="sp">Santana do Paraíso</option>
                            <option value="cf">Coronel Fabriciano</option>

                        </select>
                    </div>

                </div>

                <!-- SEXO -->
                <div class="input-box sexo-box">

                    <p>Sexo</p>

                    <div class="radio-group">

                        <label class="radio-option">
                            <input type="radio" name="sexo" value="masculino" required>
                            Masculino
                        </label>

                        <label class="radio-option">
                            <input type="radio" name="sexo" value="feminino">
                            Feminino
                        </label>

                    </div>

                </div>

                <!-- ARQUIVO -->
                <div class="input-box">

                    <label for="arquivo">Enviar arquivo</label>

                    <input type="file" id="arquivo" name="arquivo">

                </div>

                <!-- MENSAGEM -->
                <div class="input-box">

                    <label for="mensagem">Mensagem</label>

                    <textarea id="mensagem" name="mensagem" rows="6" placeholder="Digite sua mensagem"></textarea>

                </div>

                <!-- BOTÃO -->
                <button type="submit" class="submit-btn">
                    Enviar Mensagem
                </button>

            </form>

        </section>

    </main>

    <!-- FOOTER -->

    <footer>

        <p class="copyright">©Todos os direitos reservados</p>

        <ul class="nav-rodape">
            <li><a href="index.html">Início</a></li>
            <li><a href="contato.html">Contato</a></li>
          </ul>

    </footer>
</body>

</html>
